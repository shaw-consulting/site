<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet Christopher Shaw, owner of Shaw Consulting.">
  <title>About Christopher Shaw | Shaw Consulting</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; margin: 0; }
    header { align-items: center; display: flex; justify-content: space-between; margin-inline: auto; max-width: 960px; padding: 1.5rem 2rem; }
    .brand { display: inline-flex; align-items: center; }
    .brand img { width: 180px; height: auto; }
    nav a { color: inherit; font-weight: 650; text-decoration: none; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; text-underline-offset: .25rem; }
    main { margin: clamp(2rem, 6vw, 5rem) auto; max-width: 540px; padding: 0 1.5rem 3rem; text-align: center; }
    .portrait-frame { aspect-ratio: 1 / 1; background: color-mix(in srgb, CanvasText 5%, transparent); border-radius: 1.5rem; margin: 0 auto 2rem; max-width: 300px; overflow: hidden; padding: .5rem; width: 100%; }
    .portrait { border-radius: 1.1rem; display: block; height: 100%; object-fit: cover; object-position: center; width: 100%; }
    .eyebrow { color: #555; font-size: .8rem; font-weight: 750; letter-spacing: .12em; margin: 0; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 5vw, 4rem); letter-spacing: -.045em; line-height: 1; margin: .65rem 0 1.35rem; }
    p { font-size: 1.15rem; line-height: 1.65; margin: 0 auto; max-width: 39ch; }
    @media (max-width: 680px) { header { padding-inline: 1.25rem; } .brand img { width: 145px; } main { padding-inline: 1.25rem; } }
    @media (prefers-color-scheme: dark) { .eyebrow { color: #bdbdbd; } }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html" aria-label="Shaw Consulting home">
      <img src="assets/logo.svg" width="180" height="85" alt="Shaw Consulting">
    </a>
    <nav aria-label="Primary navigation"><a href="about.html" aria-current="page">About</a></nav>
  </header>
  <main>
    <div class="portrait-frame">
      <img class="portrait" src="assets/christopher-shawe.png" width="1280" height="1280" alt="Christopher Shaw">
    </div>
    <section aria-labelledby="about-heading">
      <p class="eyebrow">Owner</p>
      <h1 id="about-heading">Christopher Shaw</h1>
      <p>I'm Christopher Shaw, a software engineer with over 20 years of programming experience. I grew up on a farm, where I learned the practical value of persistence, problem-solving, and getting the job done.</p>
    </section>
  </main>
</body>
</html>
