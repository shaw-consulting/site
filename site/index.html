<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shaw Consulting | Technology Consulting</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; margin: 0; }
    header, main { max-width: 960px; margin-inline: auto; padding-inline: 2rem; }
    header { display: flex; align-items: center; justify-content: space-between; padding-block: 1.5rem; }
    .brand { display: inline-flex; align-items: center; }
    .brand img { width: 180px; height: auto; }
    nav a { color: inherit; font-weight: 650; text-decoration: none; }
    nav a:hover, nav a:focus-visible { text-decoration: underline; text-underline-offset: .25rem; }
    main { max-width: 700px; margin-top: 8vh; padding-bottom: 4rem; }
    .hero-logo { display: block; max-width: 100%; height: auto; }
    .eyebrow { color: #555; font-size: .875rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html" aria-label="Shaw Consulting home">
      <img src="assets/logo.svg" width="180" height="85" alt="Shaw Consulting">

    <nav aria-label="Primary navigation"><a href="about.html">About</a></nav>

  <main>
